services:

  trade-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trade-api

    restart: unless-stopped

    ports:
      - "8100:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  trade-web:
    build:
      context: ./web

    container_name: trade-web

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - trade-api
