name: Frontend Verify

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-verify.yml'
  push:
    branches:
      - latest-ui-full-sync
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-verify.yml'

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reject Base44 runtime dependencies
        run: |
          if grep -RniE 'base44|@base44|VITE_BASE44|base44Client' . \
            --exclude='package-lock.json' \
            --exclude-dir='node_modules' \
            --exclude-dir='dist'; then
            echo 'Base44 reference detected in frontend source/configuration.'
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
