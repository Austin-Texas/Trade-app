name: Frontend Verify

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-verify.yml'
  push:
    branches:
      - base44-latest-ui-migration
    paths:
      - 'web/**'
      - '.github/workflows/frontend-verify.yml'

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reject Base44 runtime dependencies
        run: |
          if grep -RniE '@base44|VITE_BASE44_APP_ID|base44Client' src package.json vite.config.* 2>/dev/null; then
            echo 'Base44 runtime reference detected.'
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
